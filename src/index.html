<!doctype html>
<html lang="en" class="page-fixed">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Metajurassic</title>
        <script
            async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3959623404880860"
            crossorigin="anonymous"
        ></script>
        <link
            rel="icon"
            href="<%= htmlWebpackPlugin.options.basePath %>/favicon.svg"
        />
    </head>

    <body>
        <div id="header"></div>
        <main>
            <div class="game-container">
                <div class="top-bar">
                    <div class="stat-box" id="stat-box">Guesses Left: 25</div>
                    <div class="hint-box" id="hint-box">
                        <!-- Filled by updateHintButton(); the price comes from
                             HINT_COST rather than being typed in here. -->
                        <div class="hint-text" id="hint-text"></div>
                    </div>
                    <!-- Practice-only, and hidden by default. This template is
                         registered TWICE in webpack.config.js - once as the
                         daily page, once as /practice/ - so a practice-only
                         control has to ship inert on the daily page rather than
                         be absent from it. src/practice.ts unhides and wires
                         this; src/index.ts never touches it, which is what
                         keeps the daily puzzle one-a-day.
                         See tasks/20260729-101754/DECISION.md, fork 1. -->
                    <button
                        type="button"
                        class="new-game-btn"
                        id="new-game-btn"
                        hidden
                    >
                        New<span class="new-game-word"> game</span>
                    </button>
                </div>
                <div class="game-area">
                    <!-- AdSense ad unit
                    <div class="ad-container">
                    </div>
                    -->
                    <div class="arena-wrapper" id="arena-wrapper">
                        <div class="arena" id="arena">
                            <div class="tree" id="tree-container"></div>
                        </div>
                    </div>
                    <button
                        class="panel-pull"
                        id="open-panel"
                        aria-label="Open info panel"
                    >
                        <span class="panel-pull-glyph" aria-hidden="true"
                            >⟡</span
                        >
                        <span class="panel-pull-label" id="open-panel-label"
                            >Info</span
                        >
                    </button>
                    <div class="info-panel" id="info-panel">
                        <div
                            class="panel-card-container"
                            id="panel-card-container"
                        ></div>
                    </div>
                </div>
                <div class="bottom-bar">
                    <div class="input-wrapper">
                        <div
                            class="autocomplete-box"
                            id="autocomplete-box"
                        ></div>
                        <input
                            type="text"
                            class="player-input"
                            id="player-input"
                            placeholder="Enter a dinosaur..."
                            autocomplete="off"
                        />
                        <!-- Inline rejection feedback for a guess the game
                             cannot accept. Replaces a browser alert(), which
                             broke the game feel. Hidden until it has something
                             to say, and absolutely positioned inside the
                             wrapper so showing it never changes the layout's
                             height - see .input-error in style.css. -->
                        <p
                            class="input-error"
                            id="input-error"
                            role="alert"
                            hidden
                        ></p>
                    </div>
                </div>
            </div>
        </main>
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal" id="modal">
                <div class="modal-icon" id="modal-icon"></div>
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-message" id="modal-message"></p>
                <div class="modal-stats" id="modal-stats"></div>
                <div class="modal-actions">
                    <button class="modal-btn" id="modal-close-btn">OK</button>
                    <a
                        class="modal-btn modal-btn-practice"
                        href="<%= htmlWebpackPlugin.options.basePath %>practice"
                        >Practice</a
                    >
                    <button class="modal-btn" id="modal-share-btn">
                        <span>Share</span>
                        <img class="share-icon" alt="" />
                    </button>
                </div>
            </div>
        </div>
        <div id="footer"></div>
    </body>
</html>
