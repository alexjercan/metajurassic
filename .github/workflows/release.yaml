name: Release

on:
    # Releases are cut from tags only, so master can hold WIP safely.
    push:
        tags: ["v*"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    # Build job
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  # Matches the versions ci.yml tests. Node 18 here meant the
                  # deploy path ran a version nothing gated on.
                  node-version: "22"

            - name: Setup Pages
              uses: actions/configure-pages@v3

            - name: Install npm dependencies
              run: npm install

            # One script, two builders: webpack for the game, then VitePress for
            # the docs site into dist/docs/. No second step - the order is
            # load-bearing and lives in package.json, pinned by
            # test/docsGate.test.ts.
            - name: Build the game and the docs site
              run: npm run build
              env:
                  PUBLIC_PATH: /metajurassic/

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  name: github-pages
                  path: ./dist

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    # GitHub release job, tag runs only
    release:
        runs-on: ubuntu-latest
        needs: deploy
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  test "$(node -p 'require("./package.json").version')" = "$version"
                  body_file="$(mktemp)"
                  awk -v version="$version" '
                    /^## \[/ && seen { exit }
                    /^## \[/ && $2 == "[" version "]" { seen = 1; next }
                    seen { print }
                  ' CHANGELOG.md > "$body_file"
                  test -s "$body_file"
                  gh release create "$GITHUB_REF_NAME" \
                      --title "metajurassic v${version}" \
                      --notes-file "$body_file"
